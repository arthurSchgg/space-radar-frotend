name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

jobs:
  frontend:
    name: Vanilla JS checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/config.js
          node --check js/data.js
          node --check js/radar.js
          node --check js/app.js
      - name: Data tests
        run: node --test tests/data.test.js
      - name: Static assets
        run: |
          test -s index.html
          test -s css/style.css
          test -s assets/favicon.svg
          test -s README.md
